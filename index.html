<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Camera</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Hand Camera</h1>

    <button id="start-camera" disabled>
        Loading hand tracker...
    </button>


    <p id="status">Click the button to start.</p>

    <div id="instructions">
    <h3>How to use</h3>
    <p>1. Put Hand in inital position</p>
    <p>2. Click "Recognize Sign"</p>
    <p>3. Wait for the countdown</p>
    <p>4. Perform your sign when prompted</p>
    <p>5. Confirm the detected word to hear it aloud</p>
    </div>

   <label for="sign-label">Sign:</label>

<select id="sign-label">
    <option value="Hello">Hello</option>
    <option value="How">How</option>
    <option value="Hungry">Hungry</option>
</select>

    <button id="record-sample" disabled>
        Recognize Sign
    </button>
    <div id="result-box" hidden>
    <p>We detected:</p>

    <h2 id="detected-word"></h2>

    <button id="confirm-sign">✓ Confirm</button>
    <button id="retry-sign">↻ Retry</button>
    <button id="cancel-sign">✕ Cancel</button>
</div>

  
<button id="download-data">
    Download Dataset
</button>

<p id="sample-count">Samples: 0</p>

    <div class="camera-container">

        <video
            id="webcam"
            autoplay
            playsinline
            muted>
        </video>

        <canvas id="hand-overlay"></canvas>

    </div>


    <script
        type="module"
        src="camera.js">
    </script>

</body>
</html>
