<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Camera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Hand Camera</h1>

    <button id="start-camera" disabled>Loading hand tracker...</button>
    <p id="status">Loading MediaPipe...</p>

    <div class="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="hand-overlay"></canvas>
    </div>

    <script type="module" src="camera.js"></script>
</body>
</html>
