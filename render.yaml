services:
  - type: web
    name: beyond-words-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: CORS_ORIGINS
        value: https://beyond-words.tech,https://www.beyond-words.tech,http://localhost:5173,http://127.0.0.1:5173
      - key: ELEVENLABS_API_KEY
        sync: false
